[package]
name = "grids"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6"
objc2 = "0.6"
# Only the AppKit headers Grids touches: the default set also links CloudKit, CoreData,
# CoreImage, CoreVideo and Metal, each loaded at launch for nothing.
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "bitflags", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core",
  "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSScreen", "NSWindow",
  "NSView", "NSVisualEffectView", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem",
  "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "NSColor", "NSBezierPath", "NSEvent",
  "NSHapticFeedback", "NSAnimation", "NSGraphics", "NSCell", "NSText", "NSTextField",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CATransaction"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
regex-lite = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
